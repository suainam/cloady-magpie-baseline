# Shared Magpie release for Cloady workspaces.
#
# Runs the upstream Magpie image unchanged: the entrypoint fetches the pinned
# bootstrap script and executes it, so /config is reconciled to the declared agy
# and agy-cli release on every start. No custom image is built or published.
#
# The upstream image ships sh, curl, tar, sed, grep, sha256sum and sha512sum, so
# the bootstrap needs no package install and the healthcheck uses /magpie itself.
services:
  magpie:
    # Pin the image by digest. A release bump edits this line and the
    # MAGPIE_AGY_* variables; the `config` volume survives.
    image: ghcr.io/yetone/magpie@sha256:6df9c76c9d07ad8cdd966abef1449a107e6ee136b001d6a7097f5403669f602b
    # The script is fetched at a fixed commit, so a later repository change
    # cannot alter what this release runs. Bump the commit together with the
    # agy values, after the new script passes the restart tests.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        curl -fsSL --retry 3 -o /tmp/bootstrap-agy.sh \
          "https://raw.githubusercontent.com/suainam/cloady-magpie-baseline/1563e75/bootstrap-agy.sh"
        exec /bin/sh /tmp/bootstrap-agy.sh
    ports:
      - "3425:3425"
    expose:
      - "3430"
    volumes:
      - config:/config
    environment:
      MAGPIE_AGY_VERSION: ${MAGPIE_AGY_VERSION}
      MAGPIE_AGY_DOWNLOAD_URL: ${MAGPIE_AGY_DOWNLOAD_URL}
      MAGPIE_AGY_SHA512: ${MAGPIE_AGY_SHA512}
      MAGPIE_AGY_CLI_VERSION: ${MAGPIE_AGY_CLI_VERSION}
      MAGPIE_AGY_CLI_COMMIT: ${MAGPIE_AGY_CLI_COMMIT}
      MAGPIE_AGY_CLI_SHA256: ${MAGPIE_AGY_CLI_SHA256}
      MAGPIE_ADDR: 0.0.0.0:3425
      MAGPIE_WEB_ADDR: 0.0.0.0:3430
      MAGPIE_WEB_KEY: ${MAGPIE_WEB_KEY}
      AGY_PATH: /config/home/.local/bin/agy
      AGY_CLI_DISABLE_AUTO_UPDATE: "true"
    healthcheck:
      test: ["CMD", "/magpie", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
volumes:
  config:
