# Shared Magpie release for Cloady workspaces.
#
# No version is hardcoded: the image digest and every agy / agy-cli value are
# injected from the workspace variables, so a release bump is a variables-only
# change. Cloady redeploys the container, the `config` volume survives, and
# bootstrap-agy.sh reconciles agy and agy-cli in place. Nothing is rebuilt.
#
# The upstream image ships no node/python/wget, so bootstrap-agy.sh runs as POSIX sh
# and the healthcheck uses the image's own /magpie binary. Cloady builds from this
# repository, so the script is present in the produced image at build time.
services:
  magpie:
    image: ${MAGPIE_IMAGE}
    # Dockerfile sets ENTRYPOINT to the bootstrap, so the image's own
    # Entrypoint/Cmd are replaced here; nothing else is overridden.
    entrypoint: ["/bin/sh", "/usr/local/bin/bootstrap-agy.sh"]
    ports:
      - "3425:3425"
    expose:
      - "3430"
    volumes:
      - config:/config
    environment:
      MAGPIE_AGY_VERSION: ${MAGPIE_AGY_VERSION}
      MAGPIE_AGY_DOWNLOAD_URL: ${MAGPIE_AGY_DOWNLOAD_URL}
      MAGPIE_AGY_SHA512: ${MAGPIE_AGY_SHA512}
      MAGPIE_AGY_CLI_VERSION: ${MAGPIE_AGY_CLI_VERSION}
      MAGPIE_AGY_CLI_COMMIT: ${MAGPIE_AGY_CLI_COMMIT}
      MAGPIE_AGY_CLI_SHA256: ${MAGPIE_AGY_CLI_SHA256}
      MAGPIE_ADDR: 0.0.0.0:3425
      MAGPIE_WEB_ADDR: 0.0.0.0:3430
      MAGPIE_WEB_KEY: ${MAGPIE_WEB_KEY}
      AGY_PATH: /config/home/.local/bin/agy
      AGY_CLI_DISABLE_AUTO_UPDATE: "true"
    healthcheck:
      test: ["CMD", "/magpie", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
volumes:
  config:
